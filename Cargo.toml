[package]
name = "breeze-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
codepage-437 = "0.1.0"
dirs = "7.0.0"
eframe = "0.36.1"
egui_extras = { version = "0.36.1", features = ["default", "image"] }
env_logger = "0.11.11"
image = "0.25.10"
native-tls = "0.2.18"
poll-promise = "0.3.0"
rcgen = "0.14.10"
rsa = { version = "0.9.10", features = ["getrandom"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
time = "0.3.55"
url = "2.5.8"
